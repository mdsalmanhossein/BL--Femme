<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>BL FEMME Spin Wheel</title>
<style>
  body { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; background-color: #0A0A0A; color: #D4AF37; 
    font-family: 'Arial', sans-serif; box-sizing: border-box;
  }
  h1 { 
    margin-bottom: 10px; letter-spacing: 4px; font-size: 36px;
    text-shadow: 0 0 15px #D4AF37, 0 0 30px #D4AF37; text-align: center;
  }
  #warning { 
    margin-bottom: 20px; color: #ffdd00; font-weight: bold; font-size: 18px;
    background: rgba(255, 0, 0, 0.2); padding: 8px 15px; border-radius: 20px;
    border: 1px solid #ff3333; text-align: center;
  }
  #wheel-container { position: relative; width: 440px; height: 440px; margin-bottom: 20px;}
  #wheel { 
    width: 100%; height: 100%; border-radius: 50%; border: 16px solid #D4AF37; 
    box-sizing: border-box; position: relative; overflow: hidden; 
    transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1);
    box-shadow: 0 0 40px #D4AF37, inset 0 0 20px #000;
  }
  .slice { 
    position: absolute; width: 50%; height: 50%; top: 0; left: 50%; 
    transform-origin: 0% 100%; box-sizing: border-box; 
    border: 1px solid #997A15; display: flex; align-items: center; justify-content: flex-start; 
  }
  .slice-text { 
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%) rotate(90deg); 
    font-weight: bold; font-size: 12px; color: #D4AF37; width: 180px; text-align: center; 
    background: rgba(0,0,0,0.85); padding: 6px 4px; border-radius: 4px; white-space: nowrap;
    border: 1px solid #D4AF37; text-shadow: 0 0 5px #D4AF37;
  }
  #pin { 
    position: absolute; top: -32px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; border-left: 24px solid transparent; 
    border-right: 24px solid transparent; border-top: 50px solid #D4AF37; 
    z-index: 10; filter: drop-shadow(0px 8px 10px rgba(0,0,0,1));
  }
  button { 
    margin-top: 10px; padding: 18px 60px; font-size: 24px; font-weight: bold; 
    color: #0A0A0A; background: linear-gradient(135deg, #F3E7C4, #D4AF37, #AA7C11); 
    border: 2px solid #FFF; border-radius: 50px; 
    cursor: pointer; box-shadow: 0 0 20px #D4AF37; transition: 0.3s;
  }
  button:hover { background: #FFFFFF; transform: scale(1.05); box-shadow: 0 0 30px #FFF; }
  button:disabled { background: #333; color: #777; border-color: #555; cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>

<h1>BL FEMME</h1>
<div id="warning">⚠️ সতর্কবার্তা: আপনি শুধুমাত্র একবারই স্পিন করতে পারবেন!</div>

<div id="pin"></div>
<div id="wheel-container">
  <div id="wheel"></div>
</div>
<button id="spin-btn" onclick="checkSpin()">SPIN</button>

<script>
const items = [
  "Free Delivery", "15 Tk Discount", "Premium Abaya", "Luxury Hijab",
  "Perfume Oil", "Kaftan Dress", "Silver Jewelry", "Skincare Set",
  "Voucher 500৳", "Modest Bag", "Silk Scarf", "Surprise Gift"
];

const wheel = document.getElementById('wheel');
const sliceAngle = 360 / items.length;

function createWheel() {
  wheel.innerHTML = '';
  items.forEach((item, index) => {
    const slice = document.createElement('div');
    slice.className = 'slice';
    // Deep alternating colors for better contrast
    slice.style.backgroundColor = index % 2 === 0 ? "#121212" : "#211C06";
    slice.style.transform = `rotate(${index * sliceAngle}deg) skewY(-${90 - sliceAngle}deg)`;
    
    const textDiv = document.createElement('div');
    textDiv.className = 'slice-text';
    textDiv.innerText = item;
    slice.appendChild(textDiv);
    
    slice.id = `slice-${index}`;
    wheel.appendChild(slice);
  });
}

createWheel();

let isSpinning = false;

function checkSpin() {
  if (isSpinning) return;
  
  const hasSpun = localStorage.getItem('spun_blfemme');
  
  if (hasSpun === 'true') {
    const password = prompt("🔒 আপনি ইতিমধ্যে স্পিন করেছেন। পুনরায় স্পিন করতে অ্যাডমিন পাসওয়ার্ড দিন:");
    if (password === "blrepass") {
       executeSpin();
    } else {
       alert("❌ ভুল পাসওয়ার্ড!");
    }
  } else {
    executeSpin();
  }
}

function executeSpin() {
  isSpinning = true;
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  
  const winningIndex = Math.floor(Math.random() * items.length);
  const degreesPerSlice = 360 / items.length;
  // Calculate exact degrees to center the winning slice under the top pin
  const targetDegree = (items.length - 1 - winningIndex) * degreesPerSlice + (degreesPerSlice / 2);
  const currentRotation = 360 * 6 + targetDegree;
  
  wheel.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    localStorage.setItem('spun_blfemme', 'true');
    
    // Reset wheel to base angle to prevent cumulative transform issues during color change
    wheel.style.transition = 'none';
    const normalizedRotation = currentRotation % 360;
    wheel.style.transform = `rotate(${normalizedRotation}deg)`;
    
    // Re-create wheel so all slices are aligned normally, then highlight the winner
    createWheel();
    const winningSlice = document.getElementById(`slice-${winningIndex}`);
    if(winningSlice) {
        winningSlice.style.backgroundColor = "#FFFFFF";
        const textElement = winningSlice.querySelector('.slice-text');
        if(textElement) {
            textElement.style.color = "#000000";
            textElement.style.borderColor = "#000000";
            textElement.style.background = "#FFFFFF";
        }
    }
    
    alert("🎉 অভিনন্দন! আপনি জিতেছেন: " + items[winningIndex]);
    document.getElementById('warning').innerText = "❌ আপনি ইতিমধ্যে একবার স্পিন করেছেন!";
    spinBtn.disabled = false;
    isSpinning = false;
  }, 5000);
}
</script>
</body>
</html>
