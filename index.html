<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BL FEMME - Spin Wheel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        h1 { margin-bottom: 20px; }
        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #d4af37;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            box-sizing: border-box;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 20px;
            font-size: 10px;
            font-weight: bold;
        }
        .marker {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #d4af37;
            z-index: 10;
        }
        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #d4af37;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <h1>BL FEMME</h1>
    <div class="wheel-container">
        <div class="marker"></div>
        <div id="wheel"></div>
    </div>
    <button onclick="spinWheel()">SPIN NOW</button>

    <script>
        const slicesData = [
            { text: "10% Discount", color: "#d4af37" },
            { text: "Free Ladies Bag", color: "#222" },
            { text: "Free Delivery", color: "#d4af37" },
            { text: "Free Female Pendant", color: "#222" },
            { text: "15t Discount", color: "#d4af37" },
            { text: "Free Couple Ring", color: "#222" },
            { text: "10% Discount", color: "#d4af37" },
            { text: "Free Ladies Bag", color: "#222" }
        ];

        const wheel = document.getElementById('wheel');
        const sliceAngle = 360 / slicesData.length;

        slicesData.forEach((data, index) => {
            const slice = document.createElement('div');
            slice.className = 'slice';
            slice.style.backgroundColor = data.color;
            slice.style.transform = `rotate(${index * sliceAngle}deg) skewY(-${90 - sliceAngle}deg)`;
            slice.innerHTML = `<span style="transform: skewY(${90 - sliceAngle}deg) rotate(${sliceAngle/2}deg);">${data.text}</span>`;
            wheel.appendChild(slice);
        });

        let currentRotation = 0;
        function spinWheel() {
            const randomSpin = Math.floor(Math.random() * 3600) + 360;
            currentRotation += randomSpin;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                alert("আপনি জিতেছেন!");
            }, 4000);
        }
    </script>
</body>
</html>
