<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BL FEMME Spin Wheel</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
        }
        #spin-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="wheel-container">
        <canvas id="wheel" width="600" height="600"></canvas>
        <button id="spin-btn" onclick="spinWheel()">SPIN</button>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const prizes = [
            '15% Discount', 'Pendant', '10% Discount', 'Bag', 
            '5% Discount', 'Perfume', '20% Discount', 'Scarf', 
            'Free Shipping', 'Sunglasses', '25% Discount', 'Wallet'
        ];
        const colors = ['#d4af37', '#1a1a1a'];
        const numSegments = prizes.length;
        const arc = Math.PI / (numSegments / 2);
        let startAngle = 0;
        let spinTimeout = null;
        let spinArcStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;

        function drawWheel() {
            for (let i = 0; i < numSegments; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % 2];
                ctx.beginPath();
                ctx.arc(300, 300, 250, angle, angle + arc, false);
                ctx.lineTo(300, 300);
                ctx.fill();
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.translate(300 + Math.cos(angle + arc / 2) * 180, 300 + Math.sin(angle + arc / 2) * 180);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(prizes[i], -ctx.measureText(prizes[i]).width / 2, 0);
                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd) % numSegments;
            
            // Turn winning slice white
            ctx.fillStyle = "#ffffff";
            const angle = startAngle + index * arc;
            ctx.beginPath();
            ctx.arc(300, 300, 250, angle, angle + arc, false);
            ctx.lineTo(300, 300);
            ctx.fill();
            // Redraw text
            ctx.save();
            ctx.fillStyle = "#000000";
            ctx.font = "bold 20px Arial";
            ctx.translate(300 + Math.cos(angle + arc / 2) * 180, 300 + Math.sin(angle + arc / 2) * 180);
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            ctx.fillText(prizes[index], -ctx.measureText(prizes[index]).width / 2, 0);
            ctx.restore();

            alert("You won: " + prizes[index]);
        }

        function spinWheel() {
            if(localStorage.getItem('spun') === 'true') {
                alert("You have already spun the wheel!");
                return;
            }
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3 + 4 * 1000;
            localStorage.setItem('spun', 'true');
            document.getElementById('spin-btn').disabled = true;
            rotateWheel();
        }

        function easeOut(t, b, c, d) {
            const ts = (t/=d)*t;
            const tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }

        drawWheel();
        if(localStorage.getItem('spun') === 'true') {
            document.getElementById('spin-btn').disabled = true;
        }
    </script>
</body>
</html>
