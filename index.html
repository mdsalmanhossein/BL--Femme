<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>BL FEMME Spin Wheel</title>
<style>
  body { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; background-color: #0A0A0A; color: #D4AF37; 
    font-family: 'Arial', sans-serif; 
  }
  h1 { margin-bottom: 5px; letter-spacing: 3px; text-shadow: 0 0 10px #D4AF37; }
  #warning { margin-bottom: 15px; color: #ff3333; font-weight: bold; font-size: 16px; }
  #wheel-container { position: relative; width: 450px; height: 450px; }
  #wheel { 
    width: 100%; height: 100%; border-radius: 50%; border: 15px solid #D4AF37; 
    box-sizing: border-box; position: relative; overflow: hidden; 
    transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
  }
  .slice { 
    position: absolute; width: 50%; height: 50%; top: 0; left: 50%; 
    transform-origin: 0% 100%; box-sizing: border-box; 
    border: 1px solid #D4AF37; display: flex; align-items: center; justify-content: flex-start; 
  }
  .slice-text { 
    position: absolute; left: 25px; top: 50%; transform: translateY(-50%) rotate(90deg); 
    font-weight: bold; font-size: 11px; color: #D4AF37; width: 170px; text-align: center; 
    background: rgba(0,0,0,0.9); padding: 4px; border-radius: 4px; white-space: nowrap;
    border: 1px solid #D4AF37; text-shadow: 0 0 5px #D4AF37;
  }
  #pin { 
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; border-left: 30px solid transparent; 
    border-right: 30px solid transparent; border-top: 60px solid #D4AF37; 
    z-index: 10; filter: drop-shadow(0px 8px 8px rgba(0,0,0,0.9));
  }
  button { 
    margin-top: 30px; padding: 18px 60px; font-size: 24px; font-weight: bold; 
    color: #0A0A0A; background-color: #D4AF37; border: none; border-radius: 50px; 
    cursor: pointer; box-shadow: 0 0 20px #D4AF37; transition: 0.3s;
  }
  button:hover { background-color: #fff; transform: scale(1.05); }
  button:disabled { background-color: #444; color: #888; box-shadow: none; cursor: not-allowed; }
</style>
</head>
<body>

<h1>BL FEMME</h1>
<div id="warning">⚠️ আপনি একবারই স্পিন করতে পারবেন।</div>

<div id="pin"></div>
<div id="wheel-container">
  <div id="wheel"></div>
</div>
<button id="spin-btn" onclick="checkSpin()">SPIN</button>

<script>
const items = [
  "Free Delivery", "15 Tk Discount", "Premium Abaya", "Luxury Hijab",
  "Perfume Oil", "Kaftan Dress", "Silver Jewelry", "Skincare Set",
  "Voucher 500৳", "Modest Bag", "Silk Scarf", "Surprise Gift"
];

const wheel = document.getElementById('wheel');
const sliceAngle = 360 / items.length;

items.forEach((item, index) => {
  const slice = document.createElement('div');
  slice.className = 'slice';
  slice.style.backgroundColor = index % 2 === 0 ? "#141414" : "#24240C";
  slice.style.transform = `rotate(${index * sliceAngle}deg) skewY(-${90 - sliceAngle}deg)`;
  
  const textDiv = document.createElement('div');
  textDiv.className = 'slice-text';
  textDiv.innerText = item;
  slice.appendChild(textDiv);
  
  slice.id = `slice-${index}`;
  wheel.appendChild(slice);
});

function checkSpin() {
  const hasSpun = localStorage.getItem('spun_blfemme');
  
  if (hasSpun === 'true') {
    const password = prompt("🔒 আপনি ইতিমধ্যে স্পিন করেছেন। পুনরায় স্পিন করতে অ্যাডমিন পাসওয়ার্ড দিন:");
    if (password === "blrepass") {
       executeSpin();
    } else {
       alert("❌ ভুল পাসওয়ার্ড!");
    }
  } else {
    executeSpin();
  }
}

function executeSpin() {
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  
  const winningIndex = Math.floor(Math.random() * items.length);
  const degreesPerSlice = 360 / items.length;
  const targetDegree = (items.length - 1 - winningIndex) * degreesPerSlice + (degreesPerSlice / 2);
  const currentRotation = 360 * 5 + targetDegree;
  
  wheel.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    localStorage.setItem('spun_blfemme', 'true');
    const winningSlice = document.getElementById(`slice-${winningIndex}`);
    if(winningSlice) {
        winningSlice.style.backgroundColor = "#FFFFFF";
        const textElement = winningSlice.querySelector('.slice-text');
        if(textElement) {
            textElement.style.color = "#000000";
            textElement.style.borderColor = "#000000";
        }
    }
    alert("🎉 অভিনন্দন! আপনি জিতেছেন: " + items[winningIndex]);
    document.getElementById('warning').innerText = "❌ আপনি ইতিমধ্যে একবার স্পিন করেছেন!";
    spinBtn.disabled = false;
  }, 5000);
}
</script>
</body>
</html>
