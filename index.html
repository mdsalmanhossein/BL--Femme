<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>BL FEMME Spin Wheel</title>
<style>
  body { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; background-color: #0A0A0A; color: #D4AF37; 
    font-family: 'Arial', sans-serif; box-sizing: border-box;
  }
  h1 { 
    margin-bottom: 5px; letter-spacing: 4px; font-size: 34px;
    text-shadow: 0 0 10px #D4AF37; text-align: center;
  }
  #warning { 
    margin-bottom: 15px; color: #ffdd00; font-weight: bold; font-size: 16px;
    background: rgba(255, 0, 0, 0.2); padding: 5px 10px; border-radius: 15px;
    border: 1px solid #ff3333; text-align: center;
  }
  #wheel-container { position: relative; width: 400px; height: 400px; }
  #wheel { 
    width: 100%; height: 100%; border-radius: 50%; border: 12px solid #D4AF37; 
    box-sizing: border-box; position: relative; overflow: visible; 
    transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1);
    box-shadow: 0 0 30px #D4AF37;
  }
  .slice { 
    position: absolute; width: 50%; height: 50%; top: 0; left: 50%; 
    transform-origin: 0% 100%; box-sizing: border-box; 
    border: 1px solid #D4AF37; display: flex; align-items: center; justify-content: center;
    overflow: visible;
  }
  .slice-text { 
    position: absolute; transform-origin: center;
    font-weight: bold; font-size: 12px; color: #D4AF37; 
    text-align: center; white-space: nowrap;
    text-shadow: 0 0 5px #000;
  }
  #pin { 
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; border-left: 20px solid transparent; 
    border-right: 20px solid transparent; border-top: 40px solid #D4AF37; 
    z-index: 10; filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.8));
  }
  button { 
    margin-top: 30px; padding: 15px 50px; font-size: 22px; font-weight: bold; 
    color: #0A0A0A; background: #D4AF37; border: none; border-radius: 50px; 
    cursor: pointer; box-shadow: 0 0 15px #D4AF37; transition: 0.3s;
  }
  button:hover { background: #fff; transform: scale(1.05); }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
</style>
</head>
<body>

<h1>BL FEMME</h1>
<div id="warning">⚠️ সতর্কবার্তা: আপনি শুধুমাত্র একবারই স্পিন করতে পারবেন!</div>

<div id="pin"></div>
<div id="wheel-container">
  <div id="wheel"></div>
</div>
<button id="spin-btn" onclick="checkSpin()">SPIN</button>

<script>
const items = [
  "Free Delivery", "15 Tk Discount", "Premium Abaya", "Luxury Hijab",
  "Perfume Oil", "Kaftan Dress", "Silver Jewelry", "Skincare Set",
  "Voucher 500৳", "Modest Bag", "Silk Scarf", "Surprise Gift"
];

const wheel = document.getElementById('wheel');
const sliceAngle = 360 / items.length;

function createWheel() {
  wheel.innerHTML = '';
  items.forEach((item, index) => {
    const slice = document.createElement('div');
    slice.className = 'slice';
    slice.style.backgroundColor = index % 2 === 0 ? "#1A1A1A" : "#2A2A0A";
    const rotation = index * sliceAngle;
    slice.style.transform = `rotate(${rotation}deg) skewY(-${90 - sliceAngle}deg)`;
    
    const textDiv = document.createElement('div');
    textDiv.className = 'slice-text';
    textDiv.innerText = item;
    textDiv.style.transform = `skewY(${90 - sliceAngle}deg) rotate(${sliceAngle / 2}deg) translateY(-85px)`;
    
    slice.appendChild(textDiv);
    slice.id = `slice-${index}`;
    wheel.appendChild(slice);
  });
}

createWheel();

function checkSpin() {
  const hasSpun = localStorage.getItem('spun_blfemme');
  if (hasSpun === 'true') {
    const password = prompt("🔒 আপনি ইতিমধ্যে স্পিন করেছেন। পুনরায় স্পিন করতে অ্যাডমিন পাসওয়ার্ড দিন:");
    if (password === "blrepass") {
       executeSpin();
    } else {
       alert("❌ ভুল পাসওয়ার্ড!");
    }
  } else {
    executeSpin();
  }
}

function executeSpin() {
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  
  const winningIndex = Math.floor(Math.random() * items.length);
  const degreesPerSlice = 360 / items.length;
  const targetDegree = (items.length - 1 - winningIndex) * degreesPerSlice + (degreesPerSlice / 2);
  const currentRotation = 360 * 5 + targetDegree;
  
  wheel.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    localStorage.setItem('spun_blfemme', 'true');
    createWheel();
    const winningSlice = document.getElementById(`slice-${winningIndex}`);
    if(winningSlice) {
        winningSlice.style.backgroundColor = "#FFFFFF";
        const textElement = winningSlice.querySelector('.slice-text');
        if(textElement) {
            textElement.style.color = "#000000";
            textElement.style.textShadow = "none";
        }
    }
    alert("🎉 অভিনন্দন! আপনি জিতেছেন: " + items[winningIndex]);
    document.getElementById('warning').innerText = "❌ আপনি ইতিমধ্যে একবার স্পিন করেছেন!";
    spinBtn.disabled = false;
  }, 5000);
}
</script>
</body>
</html>
