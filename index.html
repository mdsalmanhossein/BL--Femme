<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BL FEMME Spin Wheel</title>
<style>
  * { box-sizing: border-box; }
  body { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; background-color: #0A0A0A; color: #D4AF37; 
    font-family: 'Arial', sans-serif; padding: 20px;
  }
  h1 { 
    margin-bottom: 10px; letter-spacing: 4px; font-size: 32px;
    text-shadow: 0 0 10px #D4AF37; text-align: center;
  }
  #warning { 
    margin-bottom: 20px; color: #ffdd00; font-weight: bold; font-size: 15px;
    background: rgba(255, 0, 0, 0.2); padding: 8px 15px; border-radius: 20px;
    border: 1px solid #ff3333; text-align: center;
  }
  #wheel-container { position: relative; width: 380px; height: 380px; margin-bottom: 20px; }
  #wheel { 
    width: 100%; height: 100%; border-radius: 50%; border: 10px solid #D4AF37; 
    position: relative; overflow: hidden; 
    transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
  }
  .slice { 
    position: absolute; width: 50%; height: 50%; top: 0; right: 0; 
    transform-origin: 0% 100%; 
    border: 1px solid rgba(212, 175, 55, 0.4);
  }
  .slice-label {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    pointer-events: none;
  }
  .slice-text { 
    position: absolute; left: 52%; top: 25px; transform: translateX(-50%);
    font-weight: bold; font-size: 10px; color: #D4AF37; 
    text-align: center; white-space: nowrap;
    text-shadow: 0 0 4px #000;
  }
  #pin { 
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; border-left: 18px solid transparent; 
    border-right: 18px solid transparent; border-top: 35px solid #D4AF37; 
    z-index: 20; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.9));
  }
  button { 
    padding: 15px 50px; font-size: 22px; font-weight: bold; 
    color: #0A0A0A; background: linear-gradient(135deg, #F3E7C4, #D4AF37); 
    border: none; border-radius: 50px; 
    cursor: pointer; box-shadow: 0 0 20px #D4AF37; transition: 0.3s;
  }
  button:hover { background: #FFFFFF; transform: scale(1.05); }
  button:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>

<h1>BL FEMME</h1>
<div id="warning">⚠️ সতর্কবার্তা: আপনি শুধুমাত্র একবারই স্পিন করতে পারবেন!</div>

<div id="pin"></div>
<div id="wheel-container">
  <div id="wheel"></div>
</div>
<button id="spin-btn" onclick="checkSpin()">SPIN</button>

<script>
// শুধুমাত্র আপনার নির্দিষ্ট ৩টি অপশন ঘুরিয়ে ১২টি স্লাইস তৈরি করা হলো
const items = [
  "Free Delivery", "15 Tk Cashback", "10% Discount", 
  "Free Delivery", "15 Tk Cashback", "10% Discount", 
  "Free Delivery", "15 Tk Cashback", "10% Discount", 
  "Free Delivery", "15 Tk Cashback", "10% Discount"
];

const wheel = document.getElementById('wheel');
const numSlices = items.length;
const sliceAngle = 360 / numSlices;

function createWheel() {
  wheel.innerHTML = '';
  items.forEach((item, index) => {
    const slice = document.createElement('div');
    slice.className = 'slice';
    slice.style.backgroundColor = index % 2 === 0 ? "#121212" : "#221E06";
    slice.style.transform = `rotate(${index * sliceAngle}deg) skewY(-${90 - sliceAngle}deg)`;
    wheel.appendChild(slice);

    const label = document.createElement('div');
    label.className = 'slice-label';
    label.style.transform = `rotate(${index * sliceAngle + sliceAngle / 2}deg)`;

    const textDiv = document.createElement('div');
    textDiv.className = 'slice-text';
    textDiv.innerText = item;
    
    label.appendChild(textDiv);
    wheel.appendChild(label);
  });
}

createWheel();

let isSpinning = false;

function checkSpin() {
  if (isSpinning) return;
  const hasSpun = localStorage.getItem('spun_blfemme_final_v2');
  if (hasSpun === 'true') {
    const password = prompt("🔒 আপনি ইতিমধ্যে স্পিন করেছেন। পুনরায় স্পিন করতে অ্যাডমিন পাসওয়ার্ড দিন:");
    if (password === "blrepass") {
       executeSpin();
    } else {
       alert("❌ ভুল পাসওয়ার্ড!");
    }
  } else {
    executeSpin();
  }
}

function executeSpin() {
  isSpinning = true;
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  
  const winningIndex = Math.floor(Math.random() * items.length);
  const degreesPerSlice = 360 / items.length;
  const targetDegree = (items.length - winningIndex) * degreesPerSlice - (degreesPerSlice / 2);
  const currentRotation = 360 * 5 + targetDegree;
  
  wheel.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    localStorage.setItem('spun_blfemme_final_v2', 'true');
    alert("🎉 অভিনন্দন! আপনি জিতেছেন: " + items[winningIndex]);
    document.getElementById('warning').innerText = "❌ আপনি ইতিমধ্যে একবার স্পিন করেছেন!";
    spinBtn.disabled = false;
    isSpinning = false;
  }, 5000);
}
</script>
</body>
</html>
