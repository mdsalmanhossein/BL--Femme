<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Spin Wheel</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #111; color: #fff; font-family: Arial, sans-serif; }
  #wheel-container { position: relative; width: 400px; height: 400px; }
  #wheel { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #d4af37; box-sizing: border-box; position: relative; overflow: hidden; transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1); }
  .slice { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: 0% 100%; box-sizing: border-box; border: 1px solid #fff; display: flex; align-items: center; justify-content: flex-start; }
  .slice-text { position: absolute; left: 40px; top: 50%; transform: translateY(-50%) rotate(90deg); font-weight: bold; font-size: 12px; color: #000; width: 140px; text-align: center; background: rgba(255,255,255,0.9); padding: 4px; border-radius: 4px; white-space: nowrap; }
  #pin { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid red; z-index: 10; }
  button { margin-top: 40px; padding: 15px 40px; font-size: 20px; font-weight: bold; color: #fff; background-color: #d4af37; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<div id="pin"></div>
<div id="wheel-container">
  <div id="wheel"></div>
</div>
<button id="spin-btn" onclick="checkSpin()">SPIN</button>

<script>
const items = [
  "Discount 10%", "Gift Card", "Try Again", "Free Shipping",
  "Product A", "Discount 20%", "Jackpot", "Product B",
  "Cashback", "Mystery Box", "Discount 50%", "Voucher"
];
const colors = ["#FF5733", "#33FF57", "#3357FF", "#F333FF", "#FF33A8", "#33FFF5", "#F5FF33", "#FF8C33", "#8C33FF", "#33FF8C", "#FF3333", "#3333FF"];

const wheel = document.getElementById('wheel');
const sliceAngle = 360 / items.length;

items.forEach((item, index) => {
  const slice = document.createElement('div');
  slice.className = 'slice';
  slice.style.backgroundColor = colors[index % colors.length];
  slice.style.transform = `rotate(${index * sliceAngle}deg) skewY(-${90 - sliceAngle}deg)`;
  
  const textDiv = document.createElement('div');
  textDiv.className = 'slice-text';
  textDiv.innerText = item;
  slice.appendChild(textDiv);
  
  wheel.appendChild(slice);
});

let currentRotation = 0;
function checkSpin() {
  const lastSpin = localStorage.getItem('lastSpinTime');
  const now = new Date().getTime();
  const cooldownPeriod = 72 * 60 * 60 * 1000;

  if (lastSpin && (now - lastSpin < cooldownPeriod)) {
    const password = prompt("You are in cooldown. Enter Admin Password to re-spin:");
    if (password === "blrepass") {
      executeSpin();
    } else {
      alert("Invalid password or still in cooldown!");
    }
  } else {
    executeSpin();
  }
}

function executeSpin() {
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  const winningIndex = Math.floor(Math.random() * items.length);
  const degreesPerSlice = 360 / items.length;
  const targetDegree = (items.length - 1 - winningIndex) * degreesPerSlice + (degreesPerSlice / 2);
  currentRotation += 360 * 5 + targetDegree;
  
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    localStorage.setItem('lastSpinTime', new Date().getTime());
    spinBtn.disabled = false;
    alert("You won: " + items[winningIndex]);
  }, 5000);
}
</script>
</body>
</html>
